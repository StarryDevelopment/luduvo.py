[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]

name = "luduvo"

version = "2.1.0"

description = "Python wrapper for Luduvo API"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name="Moritonic", email="moritonic@gmail.com"}
]
dependencies = ["httpx>=0.24", "pyjwt>=2.12.1"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
]

[project.urls]
Documentation = "https://starrydevelopment.github.io/luduvo.py/"
Source = "https://github.com/StarryDevelopment/luduvo.py"
Issues = "https://github.com/StarryDevelopment/luduvo.py/issues"


[tool.setuptools.packages.find]
where = ["."]
include = ["luduvo", "luduvo.*"]
namespaces = false

[tool.setuptools.package-data]
luduvo = ["py.typed"]
